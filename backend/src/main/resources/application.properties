spring.application.name=plataforma-prece

# Banco principal: PostgreSQL (ver docker-compose.yml na raiz)
spring.datasource.url=${PRECE_DB_URL:jdbc:postgresql://localhost:5432/prece}
spring.datasource.username=${PRECE_DB_USER:prece}
spring.datasource.password=${PRECE_DB_PASSWORD:prece}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Em producao, trocar por migrations (Flyway/Liquibase) e usar "validate"
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT: SEMPRE sobrescrever o segredo fora do ambiente de desenvolvimento (minimo 32 caracteres)
prece.jwt.secret=${PRECE_JWT_SECRET:dev-only-secret-change-me-please-0123456789}
prece.jwt.expiration-ms=${PRECE_JWT_EXPIRATION_MS:28800000}

# CORS (frontend Vite em desenvolvimento)
prece.cors.allowed-origins=${PRECE_CORS_ORIGINS:http://localhost:5173}

# Usuario Admin criado na primeira execucao (se nao existir)
prece.admin.nome=Administrador
prece.admin.email=${PRECE_ADMIN_EMAIL:admin@prece.org}
prece.admin.senha=${PRECE_ADMIN_SENHA:admin12345}

# Swagger UI: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
